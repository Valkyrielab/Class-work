<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap bat</title>
  </head>
  <body>
    <h1>Hello, world!</h1>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
        <div class="container  d-flex align-items-center">
            <div class="col-1 width-50% align-items-left">
                <img src="image/bat1.jpg" class="card-img-left" alt="left image">
            </div>
            <div class="col-2 text-align-right">
                <h2>What to do if you find a grounded or injured bat</h2>
                <p>
                    If you find a grounded or injured bat, do not handle it with bare hands. 
                    Use gloves or a towel to place it in a secure, ventilated cardboard box, and contact a local wildlife rehabilitator or bat interest group immediately

                </p>
            </div>

        </div>
        <button type="button" class="btn btn-primary"><a href="https://batsgauteng.org.za/wp/found-a-bat/" class="text-white text-decoration-none">For more information</a></button>
  </body>
</html>
